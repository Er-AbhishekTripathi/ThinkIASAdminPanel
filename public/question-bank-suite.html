aside{display:none!important}
.shell{display:block!important;min-height:100vh!important}
.shell>main{width:100%!important;max-width:none!important;margin-left:0!important}
:root{--pri:#4f46e5;--pri-dark:#3730a3;--pri-soft:#eef2ff;--ink:#172033;--muted:#697386;--line:#e6e8ef;--surface:#fff;--bg:#f5f7fb}
html,body{background:linear-gradient(135deg,#f7f8fc 0,#f1f4fb 100%)!important}
.shell>main{padding:28px!important;max-width:1500px!important}
.page-h{background:linear-gradient(112deg,#fff 0%,#f8f9ff 58%,#eef2ff 100%);border:1px solid #e5e7f1;border-radius:16px;padding:18px 20px;margin-bottom:18px!important;box-shadow:0 8px 24px rgba(27,39,89,.06)}
.page-h h1{font-size:24px!important;font-weight:750;letter-spacing:-.35px;color:#1b2550}
.page-h .btn,.page-h a.btn{height:38px;border-radius:9px;box-shadow:none}
.page-h .btn.p{background:linear-gradient(135deg,#635bff,#4f46e5)!important;border:none!important;box-shadow:0 5px 14px rgba(79,70,229,.22)}
.stats{gap:14px!important;margin-bottom:18px!important}
.stat{border-radius:14px!important;border-color:#e7e9f1!important;padding:16px 17px!important;min-height:92px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(29,38,73,.045)}
.stat:first-child{border-top:3px solid #4f46e5}
.stat:nth-child(2){border-top:3px solid #16a085}
.stat:nth-child(3){border-top:3px solid #f59e0b}
.stat:nth-child(4){border-top:3px solid #8b5cf6}
.stat b{font-size:26px!important;color:#202b4d;line-height:1.15}
.stat span{color:#788297;font-weight:600}
.card{border-radius:15px!important;border-color:#e7e9f1!important;box-shadow:0 7px 22px rgba(29,38,73,.045)}
.card .grid{gap:14px!important}
label.l{text-transform:none!important;color:#596177!important;font-size:12px!important;font-weight:700!important;margin-bottom:6px!important}
input,select,textarea{border-radius:9px!important;border-color:#dde1eb!important;min-height:40px;background:#fff!important;transition:.18s ease}
input:focus,select:focus,textarea:focus{border-color:#7c74ee!important;box-shadow:0 0 0 3px rgba(79,70,229,.11)!important;outline:none!important}
.btn{border-radius:9px!important;border-color:#dfe2ea!important;min-height:38px;transition:.18s ease}
.btn:not(.d):not(.dd):hover{border-color:#bfc5d6;transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,#635bff,#4f46e5)!important;border:none!important}
.tabs{gap:8px!important}.tab{border-radius:8px!important}.tab.on{background:#4f46e5!important;border-color:#4f46e5!important}
.tscroll{border-radius:14px!important;border-color:#e2e5ee!important;box-shadow:0 7px 22px rgba(29,38,73,.045)}
table th{height:42px;background:#f7f8fc!important;color:#687289!important;font-size:11px!important;letter-spacing:.055em;border-bottom:1px solid #e1e4ec}
table td{padding:13px 12px!important;border-bottom-color:#edf0f5!important;color:#30384a}
table tr:hover td{background:#f9faff!important}
.q-en{font-size:14px;color:#20293d;line-height:1.55}
.q-hi{font-size:13px;color:#6d7587!important}
.badge{border-radius:6px!important;padding:3px 7px!important;font-weight:700}
.b-un{background:#dff7ec!important;color:#087f50!important}
.b-us{background:#fff1d7!important;color:#a66000!important}
.b-rp{background:#eee8ff!important;color:#6941c6!important}
.chip{border-radius:7px!important;background:#f7f8fc!important;border-color:#e5e7ef!important;color:#505b73}
.modal{border-radius:18px!important;box-shadow:0 24px 80px rgba(16,24,48,.28)!important}
.overlay{background:rgba(20,27,48,.64)!important;backdrop-filter:blur(3px)}
.toasts{gap:10px!important}.toast{border-radius:12px!important;box-shadow:0 10px 30px rgba(15,23,42,.22)!important}
@media(max-width:900px){.shell>main{padding:18px!important}.page-h{padding:15px!important}.page-h h1{font-size:21px!important}}
</style></head>

  function unlockTestEditorControls() {
    const editor = document.querySelector('app-test-editor');
    if (!editor) return;

    const warningText = 'Live test में questions बदलने के controls उपलब्ध हैं। Changes save करने के लिए Save या Save & Close चुनें।';
    editor.querySelectorAll('.warnbox').forEach(warning => {
      if (warning.textContent !== warningText) warning.textContent = warningText;
    });

    editor.querySelectorAll('button').forEach(button => {
      const label = button.textContent?.trim() || '';
      if (/Shuffle|Clear all|Bank से|^[↑↓✕]$/.test(label)) {
        button.removeAttribute('disabled');
        button.removeAttribute('aria-disabled');
        button.classList.remove('disabled');
      }
    });
  }

  unlockTestEditorControls();
  const testEditorObserver = new MutationObserver(unlockTestEditorControls);
  testEditorObserver.observe(document.documentElement, { childList: true, subtree: true });

  const api = 'http://localhost:5000/api';
  let renderedFor = '';
  let editorRenderedFor = '';
  let createRenderedFor = '';
  let modal = null;

  function headers() {
    return { 'Content-Type': 'application/json', Authorization: `Bearer ${localStorage.getItem('token') || ''}` };
  }

  async function request(path, options = {}) {
    const response = await fetch(`${api}${path}`, { ...options, headers: headers() });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  function dateValue(value) {
    if (!value) return '-';
    return new Date(value).toLocaleDateString('en-IN');
  }

  function seriesStatus(value) {
    const status = String(value?.status || '').trim().toLowerCase();
    if (['draft', 'scheduled', 'live', 'completed'].includes(status)) return status;
    return value?.isActive ? 'live' : 'draft';
  }

  function dateInputValue(value) {
    if (!value) return '';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '' : [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0')
    ].join('-');
  }

  function currentKind() {
    const hash = location.hash || '';
    if (/\/mains\/tests/.test(hash)) return 'mains';
    if (/\/prelims\/tests/.test(hash)) return 'pre';
    return '';
  }

  function isTestSeriesPage() {
    return /[?&]view=(test-series|series-create|series-editor)/.test(location.hash || '');
  }

  function seriesEditorId() {
    const match = (location.hash || '').match(/[?&]id=([^&]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }

  async function renderSeriesEditor(kind, seriesId) {
    const renderHash = location.hash;
    const response = await request(kind === 'pre' ? '/prelims-ts/admin?limit=100' : '/mains-ts/admin?limit=100');
    if (location.hash !== renderHash) return;
    const series = (response.data || []).find(row => String(row._id) === String(seriesId));
    if (!series) return;

    const questionResponse = await request(kind === 'pre' ? '/questions/all' : '/mains-questions/all');
    if (location.hash !== renderHash) return;
    const questions = questionResponse.questions || [];
    const slots = Array.isArray(series.testDates) ? series.testDates : [];
    const configured = slots.find(slot => slot.exam)?.exam || {};
    const selected = new Set((configured.questionUids || []).map(String));
    const card = document.querySelector('.series-admin-card');
    if (!card) return;
    card.innerHTML = `
      <div class="series-editor-top">

        <div class="sp"></div>

          <div><label class="l">Exam <span class="required">*</span></label><select id="seriesEditorExam"><option selected>${escapeHtml(configured.examName || 'UPSC CSE')}</option><option>UPSC CSE</option><option>State PCS</option><option>CAPF</option></select></div>
          <div><label class="l">Status</label><select id="seriesEditorStatus"><option ${seriesStatus(series) === 'live' ? 'selected' : ''}>Live</option><option ${seriesStatus(series) === 'scheduled' ? 'selected' : ''}>Scheduled</option><option ${seriesStatus(series) === 'draft' ? 'selected' : ''}>Draft</option><option ${seriesStatus(series) === 'completed' ? 'selected' : ''}>Completed</option></select></div>
          <div class="series-field-third"><label class="l">Marks / Question</label><input id="seriesEditorMarks" type="number" min="1" value="${configured.marksPerQuestion || 2}" ${kind === 'mains' ? 'readonly' : ''}></div>
          <div class="series-field-third"><label class="l">Negative Marks</label><input id="seriesEditorNegative" type="number" min="0" step="0.25" value="${kind === 'pre' ? (configured.negativeMarks ?? 0.66) : 0}" ${kind === 'mains' ? 'readonly' : ''}></div>

          <div class="series-field-third"><label class="l">End Date</label><input type="date" value="${slots.length ? dateInputValue(slots[slots.length - 1]?.date) : ''}" readonly></div>
          <div><label class="l">Duration (min)</label><input id="seriesEditorDuration" type="number" min="1" value="${configured.duration || slots[0]?.duration || (kind === 'pre' ? 120 : 180)}"></div>
          <div class="series-field-wide"><label class="l">Description</label><textarea id="seriesEditorDescription" rows="1">${escapeHtml(configured.description || '')}</textarea></div>

      </section>
      <section class="card series-editor-schedule">
        <div class="series-admin-head"><h3>Test Dates & Times</h3><button class="btn p" type="button" id="seriesEditorAddDate">＋ Add Test Date</button></div>
        <div id="seriesEditorDates" class="series-editor-dates">
          ${slots.map(slot => `<div class="series-editor-date-row"><div><label class="l">Date *</label><input type="date" class="slot-date" value="${dateInputValue(slot.date)}" required></div><div><label class="l">Time *</label><input type="time" class="slot-time" value="${escapeHtml(slot.time || '09:00')}"></div><div><label class="l">Duration (min)</label><input type="number" min="1" class="slot-duration" value="${slot.duration || configured.duration || 120}"></div><button class="btn d slot-remove" type="button">🗑 Remove</button></div>`).join('') || ''}
        </div>
      </section>
      <section class="card series-editor-questions">
        <div class="series-editor-top"><h3>Questions (${selected.size} selected) - Total Marks: <span id="seriesEditorTotal">${selected.size * (configured.marksPerQuestion || 2)}</span></h3><div class="sp"></div><button class="btn s" id="seriesEditorShuffle" type="button">🔀 Shuffle</button><button class="btn s d" id="seriesEditorClear" type="button">Clear all</button><span class="info" style="margin:0">Same questions are applied to all test dates</span></div>
        <div class="tscroll series-editor-table">
          <table><thead><tr><th style="width:42px">#</th><th>QUESTION</th><th>SUBJECT</th><th>USAGE</th></tr></thead><tbody>
          ${questions.map((question, index) => {
            const id = kind === 'pre' ? String(question.uid || '') : String(question._id || '');
            const text = question.question?.english || question.en || '';
            const subject = question.topic?.english || question.subject?.english || question.subject?.en || question.examName || '';
            const options = kind === 'pre' ? (question.options || []).map((option, index) =>
              `<div class="${index === question.correctAnswer ? 'okopt' : ''}">${String.fromCharCode(65 + index)}. ${escapeHtml(option.english || option.en || option || '')}</div>`).join('') : '';
            const used = selected.has(id) || Number(question.usageCount || question.usedCount || 0) > 0;
            const usageNames = Array.isArray(question.usedIn) ? question.usedIn : [];
            const usageText = usageNames.length ? usageNames.join(', ') : (used ? 'Used in a test' : 'Fresh • never used');
            return `<tr><td><input type="checkbox" class="paper-question" value="${escapeHtml(id)}" ${selected.has(id) ? 'checked' : ''}><span class="series-editor-question-no">${String(index + 1).padStart(2, '0')}</span></td><td><div class="q-en">${escapeHtml(text)}</div><div class="mut">${escapeHtml(id ? `UID: ${id}` : '')}</div></td><td>${escapeHtml(subject)}</td><td><span class="series-editor-usage${used ? ' used' : ''}">${escapeHtml(usageText)}</span></td></tr>`;
          }).join('') || '<tr><td colspan="4" class="mut">No questions found in this bank.</td></tr>'}

        </div>
      </section>`;

    card.querySelector('#seriesEditorBack').onclick = () => {
      location.hash = `#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=test-series`;
    };
    const updateCount = () => {
      const count = card.querySelectorAll('.paper-question:checked').length;
      card.querySelector('h3').innerHTML = `Questions (${count} selected) - Total Marks: <span id="seriesEditorTotal">${count * Number(card.querySelector('#seriesEditorMarks').value || 0)}</span>`;
    };
    card.querySelectorAll('.paper-question').forEach(input => input.onchange = updateCount);
    card.querySelector('#seriesEditorMarks').oninput = updateCount;
    card.querySelector('#seriesEditorClear').onclick = () => {
      card.querySelectorAll('.paper-question:checked').forEach(input => { input.checked = false; });
      updateCount();
    };
    card.querySelector('#seriesEditorShuffle').onclick = () => {
      const tbody = card.querySelector('.series-editor-table tbody');
      const rows = [...tbody.querySelectorAll('tr')];
      for (let index = rows.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        tbody.insertBefore(rows[index], rows[swapIndex]);
      }
    };
    const dateContainer = card.querySelector('#seriesEditorDates');
    const bindRemoveButtons = () => dateContainer.querySelectorAll('.slot-remove').forEach(button => {
      button.onclick = () => button.closest('.series-editor-date-row')?.remove();
    });
    bindRemoveButtons();
    card.querySelector('#seriesEditorAddDate').onclick = () => {
      const row = document.createElement('div');
      row.className = 'series-editor-date-row';
      row.innerHTML = `<div><label class="l">Date *</label><input type="date" class="slot-date" required></div><div><label class="l">Time *</label><input type="time" class="slot-time" value="09:00"></div><div><label class="l">Duration (min)</label><input type="number" min="1" class="slot-duration" value="${configured.duration || 120}"></div><button class="btn d slot-remove" type="button">🗑 Remove</button>`;
      dateContainer.appendChild(row);
      bindRemoveButtons();
    };
    const saveSeriesEditor = async closeAfterSave => {
      const questionUids = [...card.querySelectorAll('.paper-question:checked')].map(input => input.value).filter(Boolean);
      if (!questionUids.length) {
        alert('Please select at least one question.');
        return;
      }
      const dates = [...dateContainer.querySelectorAll('.series-editor-date-row')].map(row => ({
        date: row.querySelector('.slot-date').value,
        time: row.querySelector('.slot-time').value || '09:00',
        duration: Number(row.querySelector('.slot-duration').value || 120)
      })).filter(slot => slot.date);
      if (!dates.length) {
        alert('Add at least one test date.');
        return;
      }
      const submit = closeAfterSave ? card.querySelector('#seriesEditorSaveClose') : card.querySelector('#seriesEditorSave');
      submit.disabled = true;
      try {
        const updated = await request(`/${kind === 'pre' ? 'prelims-ts' : 'mains-ts'}/${series._id}`, {
          method: 'PUT',
          body: JSON.stringify({
            name: series.name,
            nameHi: series.nameHi || '',
            description: document.querySelector('#seriesEditorDescription')?.value || series.description,
            startDate: dates[0].date,
            endDate: dates[dates.length - 1].date,
            testDates: dates,
            status: document.querySelector('#seriesEditorStatus').value.toLowerCase(),
            isActive: document.querySelector('#seriesEditorStatus').value.toLowerCase() !== 'draft'
          })
        });
        const refreshedSlots = updated?.data?.testDates || [];
        for (const slot of refreshedSlots) {
          const slotId = String(slot._id || slot.id || '');
          await request(`/${kind === 'pre' ? 'prelims-ts' : 'mains-ts'}/${series._id}/slots/${slotId}/exam`, {
            method: 'POST',
            body: JSON.stringify({
              title: document.querySelector('#seriesEditorTitle').value,
              duration: Number(document.querySelector('#seriesEditorDuration').value),
              marksPerQuestion: Number(document.querySelector('#seriesEditorMarks').value || 2),
              negativeMarks: kind === 'pre' ? Number(document.querySelector('#seriesEditorNegative').value || 0) : 0,
              examName: document.querySelector('#seriesEditorExam')?.value || '',
              description: document.querySelector('#seriesEditorDescription')?.value || '',
              questionUids
            })
          });
        }
        if (closeAfterSave) location.hash = `#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=test-series`;
        else alert('Series and questions saved successfully.');
      } catch (error) {
        alert(error.message);
      } finally {
        submit.disabled = false;
      }
    };
    card.querySelector('#seriesEditorSave').onclick = () => saveSeriesEditor(false);
    card.querySelector('#seriesEditorSaveClose').onclick = () => saveSeriesEditor(true);
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

    modal.innerHTML = `

        <div class="modal-h"><h2>${existing._id ? 'Edit Test' : 'Create Test'} - ${escapeHtml(series.name)}</h2><button class="x" id="closePaper" type="button">×</button></div>
        <form id="seriesPaperForm">
          <div class="series-form-grid">
            <div class="full"><label class="l">Test Title *</label><input name="title" required value="${escapeHtml(existing.title || `${series.name} - ${dateValue(slot.date)}`)}"></div>
            <div><label class="l">Duration (minutes) *</label><input name="duration" type="number" min="1" required value="${existing.duration || slot.duration || (kind === 'pre' ? 120 : 180)}"></div>
            ${kind === 'pre' ? `
            <div><label class="l">Marks per Question *</label><input name="marksPerQuestion" type="number" min="1" required value="${existing.marksPerQuestion || 2}"></div>
            <div><label class="l">Negative Marks</label><input name="negativeMarks" type="number" min="0" step="0.25" value="${existing.negativeMarks ?? 0.66}"></div>` : ''}
          </div>
          <h3 style="margin-top:14px">Select Questions (${questions.length} available)</h3>
          <div class="tscroll" style="max-height:430px">
            <table><thead><tr><th style="width:36px"></th><th>Question</th>${kind === 'pre' ? '<th>Options / Answer</th>' : ''}</tr></thead><tbody>
            ${questions.map((question, index) => {
              const id = kind === 'pre' ? String(question.uid || '') : String(question._id || '');
              const text = question.question?.english || question.en || '';
              const options = kind === 'pre' ? (question.options || []).map((option, optionIndex) =>
                `<div class="${optionIndex === question.correctAnswer ? 'okopt' : ''}">${String.fromCharCode(65 + optionIndex)}. ${escapeHtml(option.english || option.en || option || '')}</div>`).join('') : '';
              return `<tr><td><input type="checkbox" class="paper-question" value="${escapeHtml(id)}" ${selected.has(id) ? 'checked' : ''}></td><td><div class="q-en">${escapeHtml(text)}</div><div class="mut">UID: ${escapeHtml(id)}</div></td>${kind === 'pre' ? `<td>${options}</td>` : ''}</tr>`;
            }).join('') || '<tr><td colspan="3" class="mut">No questions found in this bank.</td></tr>'}
            </tbody></table>
          </div>
          <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cancelPaper" type="button">Cancel</button><button class="btn p" type="submit">Save Test</button></div>
        </form>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#closePaper').onclick = closeModal;
    modal.querySelector('#cancelPaper').onclick = closeModal;
    modal.querySelector('#seriesPaperForm').onsubmit = async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const questionUids = [...modal.querySelectorAll('.paper-question:checked')].map(input => input.value);
      if (!questionUids.length) {
        alert('Please select at least one question.');
        return;
      }
      const submit = event.submitter;
      submit.disabled = true;
      try {
        await request(`/` + (kind === 'pre' ? 'prelims-ts' : 'mains-ts') + `/${series._id}/slots/${slotId}/exam`, {
          method: 'POST',
          body: JSON.stringify({
            title: form.get('title'),
            duration: Number(form.get('duration')),
            marksPerQuestion: Number(form.get('marksPerQuestion') || 2),
            negativeMarks: kind === 'pre' ? Number(form.get('negativeMarks') || 0) : 0,
            questionUids
          })
        });
        closeModal();
        await renderSeries(kind);
      } catch (error) {
        alert(error.message);
      } finally {
        submit.disabled = false;
      }
    };
  }

  function closeModal() {
    if (modal) modal.remove();
    modal = null;
  }

  async function saveSeries(kind, form) {
    const fields = new FormData(form);
    const slots = [...form.querySelectorAll('.series-slot')].map(slot => ({
      date: slot.querySelector('[name="slotDate"]').value,
      time: slot.querySelector('[name="slotTime"]').value || '09:00',
      duration: Number(slot.querySelector('[name="slotDuration"]').value || (kind === 'pre' ? 120 : 180))
    })).filter(slot => slot.date);
    if (!slots.length) throw new Error('At least one test date is required');
    const payload = {
      name: fields.get('name'),
      nameHi: fields.get('nameHi') || '',
      description: fields.get('description'),
      descriptionHi: fields.get('descriptionHi') || '',
      intro: fields.get('intro') || '',
      introHi: fields.get('introHi') || '',
      startDate: fields.get('startDate'),
      endDate: fields.get('endDate'),
      testDates: slots,
      isActive: fields.get('status') !== 'draft',
      status: fields.get('status')
    };
    return request(kind === 'pre' ? '/prelims-ts' : '/mains-ts', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
  }

  function openCreateSeries(kind) {
    location.hash = `#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=series-create`;
  }

  async function renderCreateSeries(kind) {
    closeModal();
    const page = document.querySelector('.page-h');
    let card = document.querySelector('.series-admin-card');
    if (!card) {
      card = document.createElement('section');
      card.className = 'card series-admin-card';
      page.insertAdjacentElement('afterend', card);
    }
    card.innerHTML = `
      <div class="series-editor-top"><h2>Create ${kind === 'pre' ? 'Prelims' : 'Mains'} Test Series</h2><span class="sp"></span><button class="btn" type="button" id="cancelCreateSeries">Cancel</button></div>
      <form id="seriesForm">
        <div class="card series-editor-details">
          <div class="series-form-grid">
            <div><label class="l">Series Name *</label><input name="name" required minlength="3"></div>
            <div><label class="l">Series Name (Hindi)</label><input name="nameHi"></div>
            <div class="full"><label class="l">Description *</label><textarea name="description" required minlength="10" rows="3"></textarea></div>
            <div><label class="l">Introduction</label><textarea name="intro" rows="3"></textarea></div>
            <div><label class="l">Introduction (Hindi)</label><textarea name="introHi" rows="3"></textarea></div>

          </div>
        </div>
        <div class="card">

          <div id="seriesSlots"></div>
        </div>
        <section class="card series-create-questions">
          <div class="series-editor-top"><h3 id="createSeriesQuestionHeading">Questions (0) - Total Marks: <span>0</span></h3><div class="sp"></div><button class="btn s" id="createSeriesShuffle" type="button">🔀 Shuffle</button><button class="btn s d" id="createSeriesClear" type="button">Clear all</button><button class="btn s p" id="createSeriesBank" type="button">+ Bank से Questions जोड़ें</button></div>
          <div class="tscroll series-editor-table"><table><thead><tr><th style="width:42px">#</th><th>QUESTION</th><th>SUBJECT</th><th>USAGE</th></tr></thead><tbody id="createSeriesQuestionRows"><tr><td colspan="4" class="mut" style="text-align:center;padding:22px">कोई questions अभी select नहीं हैं। “Bank से Questions जोड़ें” दबाएं।</td></tr></tbody></table></div>
        </section>
        <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" type="button" id="cancelSeries">Cancel</button><button class="btn p" type="submit">Create Test Series</button></div>
      </form>`;
    const cancel = () => location.hash = `#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=test-series`;
    card.querySelector('#cancelCreateSeries').onclick = cancel;
    card.querySelector('#cancelSeries').onclick = cancel;

    const slots = card.querySelector('#seriesSlots');
    function addSlot() {
      const row = document.createElement('div');
      row.className = 'series-slot';
      row.innerHTML = `
        <div class="series-slot-grid">
          <div><label class="l">Test Date *</label><input name="slotDate" type="date" required></div>
          <div><label class="l">Time</label><input name="slotTime" type="time" value="09:00"></div>
          <div><label class="l">Duration (minutes)</label><input name="slotDuration" type="number" min="1" value="${kind === 'pre' ? 120 : 180}"></div>
          <button class="btn d" type="button">Remove</button>
        </div>`;
      row.querySelector('button').onclick = () => row.remove();
      slots.appendChild(row);
    }
    card.querySelector('#addSeriesSlot').onclick = addSlot;
    addSlot();

    let bankQuestions = [];
    try {
      const response = await request(kind === 'pre' ? '/questions/all' : '/mains-questions/all');
      bankQuestions = response.questions || [];
    } catch (error) {
      alert(error.message);
    }
    const selectedQuestions = new Map();
    const questionRows = card.querySelector('#createSeriesQuestionRows');
    const updateCreateQuestionCount = () => {
      card.querySelector('#createSeriesQuestionHeading').innerHTML = `Questions (${selectedQuestions.size}) - Total Marks: <span>${selectedQuestions.size * 2}</span>`;
    };
    const renderSelectedQuestions = () => {
      const rows = [...selectedQuestions.values()].map((question, index) => {
        const id = kind === 'pre' ? String(question.uid || '') : String(question._id || '');
        const text = question.question?.english || question.en || '';
        const subject = question.topic?.english || question.subject?.english || question.subject?.en || question.examName || '';
        const usageNames = Array.isArray(question.usedIn) ? question.usedIn : [];
        const usage = usageNames.length ? usageNames.join(', ') : (Number(question.usageCount || 0) > 0 ? 'Used in a test' : 'Fresh • never used');
        return `<tr data-question-id="${escapeHtml(id)}"><td><button class="btn s d remove-create-question" type="button" title="Remove">×</button></td><td><div class="q-en">${escapeHtml(text)}</div><div class="mut">UID: ${escapeHtml(id)}</div></td><td>${escapeHtml(subject)}</td><td><span class="series-editor-usage${usageNames.length || Number(question.usageCount || 0) ? ' used' : ''}">${escapeHtml(usage)}</span></td></tr>`;
      });
      questionRows.innerHTML = rows.length ? rows.join('') : '<tr><td colspan="4" class="mut" style="text-align:center;padding:22px">कोई questions अभी select नहीं हैं। “Bank से Questions जोड़ें” दबाएं।</td></tr>';
      questionRows.querySelectorAll('.remove-create-question').forEach(button => {
        button.onclick = () => {
          selectedQuestions.delete(button.closest('tr').dataset.questionId);
          renderSelectedQuestions();
        };
      });
      updateCreateQuestionCount();
    };
    card.querySelector('#createSeriesShuffle').onclick = () => {
      const entries = [...selectedQuestions.entries()];
      for (let index = entries.length - 1; index > 0; index--) {
        const swap = Math.floor(Math.random() * (index + 1));
        [entries[index], entries[swap]] = [entries[swap], entries[index]];
      }
      selectedQuestions.clear();
      entries.forEach(([id, question]) => selectedQuestions.set(id, question));
      renderSelectedQuestions();
    };
    card.querySelector('#createSeriesClear').onclick = () => {
      selectedQuestions.clear();
      renderSelectedQuestions();
    };
    card.querySelector('#createSeriesBank').onclick = () => {
      closeModal();
      modal = document.createElement('div');
      modal.className = 'overlay';
      modal.innerHTML = `<div class="modal lg"><div class="modal-h"><h2>Select Questions from Bank</h2><button class="x" type="button" id="closeCreateBank">×</button></div><input id="createBankSearch" placeholder="Search questions..."><div class="tscroll" style="max-height:65vh;margin-top:12px"><table><thead><tr><th style="width:50px"></th><th>QUESTION</th><th>SUBJECT</th><th>USAGE</th></tr></thead><tbody>${bankQuestions.map(question => {
        const id = kind === 'pre' ? String(question.uid || '') : String(question._id || '');
        const text = question.question?.english || question.en || '';
        const subject = question.topic?.english || question.subject?.english || question.subject?.en || question.examName || '';
        const usageNames = Array.isArray(question.usedIn) ? question.usedIn : [];
        const usage = usageNames.length ? usageNames.join(', ') : (Number(question.usageCount || 0) > 0 ? 'Used in a test' : 'Fresh • never used');
        return `<tr class="create-bank-row" data-search="${escapeHtml(`${text} ${subject}`).toLowerCase()}"><td><input type="checkbox" class="create-bank-question" value="${escapeHtml(id)}" ${selectedQuestions.has(id) ? 'checked' : ''}></td><td>${escapeHtml(text)}<div class="mut">${escapeHtml(id)}</div></td><td>${escapeHtml(subject)}</td><td><span class="series-editor-usage${usageNames.length || Number(question.usageCount || 0) ? ' used' : ''}">${escapeHtml(usage)}</span></td></tr>`;
      }).join('') || '<tr><td colspan="4">No questions found.</td></tr>'}</tbody></table></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" type="button" id="cancelCreateBank">Cancel</button><button class="btn p" type="button" id="applyCreateBank">Add Selected Questions</button></div></div>`;
      document.body.appendChild(modal);
      const close = () => closeModal();
      modal.querySelector('#closeCreateBank').onclick = close;
      modal.querySelector('#cancelCreateBank').onclick = close;
      modal.querySelector('#createBankSearch').oninput = event => {
        modal.querySelectorAll('.create-bank-row').forEach(row => row.style.display =         row.dataset.search.includes(event.target.value.trim().toLowerCase()) ? '' : 'none');
      };
      modal.querySelector('#applyCreateBank').onclick = () => {
        modal.querySelectorAll('.create-bank-question:checked').forEach(input => {
          const question = bankQuestions.find(item => String(kind === 'pre' ? item.uid : item._id) === input.value);
          if (question) selectedQuestions.set(input.value, question);
        });
        renderSelectedQuestions();
        close();
      };
    };

    card.querySelector('#seriesForm').onsubmit = async event => {
      event.preventDefault();
      const submit = event.submitter;
      submit.disabled = true;
      try {
        const created = await saveSeries(kind, event.currentTarget);
        const seriesId = String(
          created?.data?._id ||
          created?.data?.data?._id ||
          created?._id ||
          created?.id ||
          ''
        );
        if (seriesId) {
          const questionUids = [...selectedQuestions.keys()];
          if (questionUids.length) {
            const createdSeries = created?.data || created;
            const refreshedSlots = createdSeries?.testDates || [];
            for (const slot of refreshedSlots) {
              await request(`/${kind === 'pre' ? 'prelims-ts' : 'mains-ts'}/${encodeURIComponent(seriesId)}/slots/${encodeURIComponent(slot._id || slot.id || '')}/exam`, {
                method: 'POST',
                body: JSON.stringify({
                  title: created?.data?.name || '',
                  duration: Number(slot.duration || (kind === 'pre' ? 120 : 180)),
                  marksPerQuestion: 2,
                  negativeMarks: kind === 'pre' ? 0.66 : 0,
                  examName: 'UPSC CSE',
                  questionUids
                })
              });
            }
          }
          location.hash = `#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=series-editor&id=${encodeURIComponent(seriesId)}`;
        } else {
          await renderSeries(kind);
        }
      } catch (error) {
        alert(error.message);
      } finally {
        submit.disabled = false;
      }
    };
  }

  async function renderSeries(kind) {
    const page = document.querySelector('.page-h');
    if (!page) return;
    const renderHash = location.hash;
    let card = document.querySelector('.series-admin-card');
    if (!card) {
      card = document.createElement('section');
      card.className = 'card series-admin-card';
      page.insertAdjacentElement('afterend', card);
    }
    renderedFor = kind;
    card.innerHTML = `<div class="series-admin-head">${isTestSeriesPage() ? '' : `<h2>${kind === 'pre' ? 'Prelims' : 'Mains'} Test Series</h2>`}<button class="btn p" id="createSeriesBtn">＋ Create Test Series</button></div><div class="series-grid"><div class="series-empty">Loading...</div></div>`;
    if (isTestSeriesPage()) card.querySelector('#createSeriesBtn')?.remove();
    if (card.querySelector('#createSeriesBtn')) card.querySelector('#createSeriesBtn').onclick = () => openCreateSeries(kind);
    try {
      const response = await request(kind === 'pre' ? '/prelims-ts/admin?limit=100' : '/mains-ts/admin?limit=100');
      if (location.hash !== renderHash || !card.isConnected) return;
      const rows = response.data || [];
      card.classList.add('series-table-card');
      card.querySelector('.series-grid').innerHTML = `
        <div class="series-list-filters">
          <div><label class="l">Search</label><input id="seriesListSearch" placeholder="Series name"></div>
          <div><label class="l">Exam</label><select id="seriesListExam"><option value="">All</option><option>UPSC CSE</option><option>UPPSC</option><option>APSC Assam</option><option>TNPSC</option><option>Common</option></select></div>
          <div><label class="l">Status</label><select id="seriesListStatus"><option value="">All</option><option value="draft">Draft</option><option value="scheduled">Scheduled</option><option value="live">Live</option><option value="completed">Completed</option></select></div>
        </div>
        <div class="tscroll series-list-table"><table>
          <thead><tr><th>TEST SERIES</th><th>EXAM</th><th>DATE</th><th>TESTS</th><th>QUESTIONS</th><th>MARKS</th><th>STATUS</th><th>ACTIONS</th></tr></thead>
          <tbody>${rows.length ? rows.map(series => {
        const status = seriesStatus(series);
        const configured = (series.testDates || []).map(slot => slot.exam).find(exam => exam) || {};
        const examName = configured.examName || 'UPSC CSE';
        const papers = (series.testDates || []).map(slot => slot.exam).filter(Boolean);
        const questionCount = papers.reduce((count, paper) => count + (paper.questionUids || []).length, 0);
        const marks = papers.reduce((total, paper) => total + (paper.questionUids || []).length * Number(paper.marksPerQuestion || configured.marksPerQuestion || 2), 0);
        return `<tr class="series-list-row" data-status="${status}" data-exam="${escapeHtml(examName)}" data-name="${escapeHtml(series.name || '').toLowerCase()}">
          <td><a href="#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=series-editor&id=${encodeURIComponent(series._id)}" class="series-list-name">${escapeHtml(series.name || '')}</a></td>
          <td><span class="badge b-exam">${escapeHtml(examName)}</span></td>
          <td>${dateValue(series.startDate)}</td>
          <td>${series.testDates?.length || 0}</td><td>${questionCount}</td><td>${marks}</td>
          <td><select class="series-list-status" data-series-id="${escapeHtml(series._id)}"><option value="draft" ${status === 'draft' ? 'selected' : ''}>Draft</option><option value="scheduled" ${status === 'scheduled' ? 'selected' : ''}>Scheduled</option><option value="live" ${status === 'live' ? 'selected' : ''}>Live</option><option value="completed" ${status === 'completed' ? 'selected' : ''}>Completed</option></select></td>
          <td class="series-list-actions"><button class="btn s p manage-series-tests" type="button" data-series-id="${escapeHtml(series._id)}">Manage Tests</button><button class="btn s d delete-series" type="button" data-series-id="${escapeHtml(series._id)}" data-series-name="${escapeHtml(series.name || '')}">🗑</button></td>
        </tr>`;
      }).join('') : '<tr><td colspan="8" class="mut series-empty">No test series created yet.</td></tr>'}</tbody>
        </table></div>`;
      [...card.querySelectorAll('.manage-series-tests')].forEach((button, index) => {
            button.onclick = () => {
              location.hash = `#/${kind === 'pre' ? 'prelims' : 'mains'}/tests?view=series-editor&id=${encodeURIComponent(button.dataset.seriesId)}`;
            };
          });
      const filterSeriesTable = () => {
        const search = card.querySelector('#seriesListSearch')?.value.trim().toLowerCase() || '';
        const exam = card.querySelector('#seriesListExam')?.value || '';
        const status = card.querySelector('#seriesListStatus')?.value || '';
        card.querySelectorAll('.series-list-row').forEach(row => {
          const matchesSearch = !search || row.dataset.name.includes(search);
          const matchesExam = !exam || row.dataset.exam === exam;
          const matchesStatus = !status || row.dataset.status === status;
          row.style.display = matchesSearch && matchesExam && matchesStatus ? '' : 'none';
        });
      };
      card.querySelector('#seriesListSearch')?.addEventListener('input', filterSeriesTable);
      card.querySelector('#seriesListExam')?.addEventListener('change', filterSeriesTable);
      card.querySelector('#seriesListStatus')?.addEventListener('change', filterSeriesTable);
      [...card.querySelectorAll('.series-list-status')].forEach(select => {
        select.onchange = async () => {
          const status = select.value;
          select.disabled = true;
          try {
            await request(`/${kind === 'pre' ? 'prelims-ts' : 'mains-ts'}/${encodeURIComponent(select.dataset.seriesId)}`, {
              method: 'PUT',
              body: JSON.stringify({ status, isActive: status === 'live' })
            });
            await renderSeries(kind);
          } catch (error) {
            alert(error.message);
            select.disabled = false;
          }
        };
      });
      [...card.querySelectorAll('.delete-series')].forEach(button => {
        button.onclick = async () => {
          const seriesName = button.dataset.seriesName || 'this test series';
          if (!window.confirm(`Delete "${seriesName}" and all of its scheduled tests?`)) return;
          button.disabled = true;
          try {
            await request(`/${kind === 'pre' ? 'prelims-ts' : 'mains-ts'}/${encodeURIComponent(button.dataset.seriesId)}`, {
              method: 'DELETE'
            });
            await renderSeries(kind);
          } catch (error) {
            alert(error.message);
            button.disabled = false;
          }
        };
      });
    } catch (error) {
      card.querySelector('.series-grid').innerHTML = `<div class="series-empty">${error.message}</div>`;
    }
  }

  function sync() {
    const kind = currentKind();
    const pageHeading = document.querySelector('.page-h');
    if (!kind || !pageHeading) {
      renderedFor = '';
      document.querySelector('.series-admin-card')?.remove();
      return;
    }
    const dedicatedPage = isTestSeriesPage();
    const headingTitle = pageHeading.querySelector('h1');
    const headingActions = pageHeading.querySelector('.row');
    if (headingTitle && !('qbsOriginalText' in headingTitle.dataset)) {
      headingTitle.dataset.qbsOriginalText = headingTitle.textContent || '';
    }
    if (headingActions && !('qbsOriginalDisplay' in headingActions.dataset)) {
      headingActions.dataset.qbsOriginalDisplay = headingActions.style.display;
    }
    [...pageHeading.querySelectorAll('button')].forEach(button => {
      if (!/Create Test/i.test(button.textContent || '') || button.id === 'createSeriesHeaderBtn') return;
      if (!('qbsOriginalDisplay' in button.dataset)) {
        button.dataset.qbsOriginalDisplay = button.style.display;
      }
    });
    if (dedicatedPage) {
      if (headingTitle) headingTitle.textContent = kind === 'pre' ? '📝 Prelims Test Series' : '📝 Mains Test Series';
      if (headingActions) headingActions.style.display = 'none';
      [...pageHeading.querySelectorAll('button')].forEach(button => {
        if (/Create Test/i.test(button.textContent || '') && button.id !== 'createSeriesHeaderBtn') {
          button.style.display = 'none';
        }
      });
      let createSeriesHeaderButton = pageHeading.querySelector('#createSeriesHeaderBtn');
      if (!createSeriesHeaderButton) {
        const spacer = document.createElement('span');
        spacer.className = 'sp';
        spacer.id = 'createSeriesHeaderSpacer';
        pageHeading.appendChild(spacer);
        createSeriesHeaderButton = document.createElement('button');
        createSeriesHeaderButton.id = 'createSeriesHeaderBtn';
        createSeriesHeaderButton.className = 'btn p';
        createSeriesHeaderButton.type = 'button';
        createSeriesHeaderButton.textContent = '＋ Create Test Series';
        pageHeading.appendChild(createSeriesHeaderButton);
      } else {
        createSeriesHeaderButton.style.display = '';
      }
      createSeriesHeaderButton.onclick = () => openCreateSeries(kind);
      pageHeading.querySelector('.series-admin-head')?.remove();
      if (pageHeading.nextElementSibling && !pageHeading.nextElementSibling.hasAttribute('data-qbs-series-card')) {
        pageHeading.nextElementSibling.dataset.qbsSeriesCard = 'true';
        pageHeading.nextElementSibling.classList.add('series-card');
      }
      [...pageHeading.parentElement.children].forEach(element => {
        if (element !== pageHeading && element !== document.querySelector('.series-admin-card')) {
          if (!('qbsOriginalDisplay' in element.dataset)) {
            element.dataset.qbsOriginalDisplay = element.style.display;
          }
          element.style.display = 'none';
        }
      });
    } else {
      document.querySelectorAll('.series-admin-card').forEach(element => element.remove());
      pageHeading.querySelector('#createSeriesHeaderBtn')?.remove();
      pageHeading.querySelector('#createSeriesHeaderSpacer')?.remove();
      if (headingTitle && 'qbsOriginalText' in headingTitle.dataset) {
        headingTitle.textContent = headingTitle.dataset.qbsOriginalText;
      }
      if (headingActions && 'qbsOriginalDisplay' in headingActions.dataset) {
        headingActions.style.display = headingActions.dataset.qbsOriginalDisplay;
      }
      [...pageHeading.querySelectorAll('button')].forEach(button => {
        if ('qbsOriginalDisplay' in button.dataset) {
          button.style.display = button.dataset.qbsOriginalDisplay;
        }
      });
      renderedFor = '';
      [...pageHeading.parentElement.children].forEach(element => {
        if ('qbsOriginalDisplay' in element.dataset) {
          element.style.display = element.dataset.qbsOriginalDisplay;
          delete element.dataset.qbsOriginalDisplay;
        }
        if (element.hasAttribute('data-qbs-series-card')) {
          element.classList.remove('series-card');
          delete element.dataset.qbsSeriesCard;
        }
      });
    }
    if (dedicatedPage && /series-create/.test(location.hash || '')) {
      const editorKey = `${kind}:create`;
      if (createRenderedFor !== editorKey) {
        createRenderedFor = editorKey;
        setTimeout(() => renderCreateSeries(kind), 0);
      }
    } else if (dedicatedPage && /series-editor/.test(location.hash || '')) {
      if (!document.querySelector('.series-admin-card')) renderSeries(kind);
      const editorKey = `${kind}:${seriesEditorId()}`;
      if (editorRenderedFor !== editorKey) {
        editorRenderedFor = editorKey;
        setTimeout(() => renderSeriesEditor(kind, seriesEditorId()), 0);
      }
    } else if (dedicatedPage && (renderedFor !== kind || !document.querySelector('.series-admin-card'))) {
      renderSeries(kind);
    }
  }

  window.addEventListener('hashchange', () => { renderedFor = ''; editorRenderedFor = ''; createRenderedFor = ''; sync(); });
  setInterval(sync, 500);
})();
</script><script>document.querySelectorAll('link[data-beasties-media]').forEach(function(l){l.media=l.getAttribute('data-beasties-media');l.removeAttribute('data-beasties-media')})</script><script>
(() => {
  let exams = [];
  let loadError = false;

  const updateExamDropdown = () => {
    const select = document.getElementById('seriesEditorExam');
    if (!select) return;

    const selectedName = select.value;
    const selectedExam = exams.find(exam => exam.name.toLowerCase() === selectedName.toLowerCase());
    const options = [new Option('Select exam', '')];

    if (loadError) {
      options.push(new Option('Exams could not be loaded', ''));
      options[1].disabled = true;
    } else {
      exams.forEach(exam => options.push(new Option(exam.name, exam.name)));
      if (selectedName && !selectedExam) {
        options.push(new Option(`${selectedName} (saved)`, selectedName));
      }
    }

    const optionsAreCurrent = select.options.length === options.length &&
      options.every((option, index) => {
        const current = select.options[index];
        return current.value === option.value && current.text === option.text && current.disabled === option.disabled;
      });
    if (optionsAreCurrent) return;

    select.replaceChildren(...options);
    select.value = selectedExam?.name || selectedName || '';
  };

  window.addEventListener('message', event => {
    if (event.origin !== window.location.origin || event.source !== window.parent ||
        event.data?.type !== 'question-bank-suite-exams') return;

    exams = Array.isArray(event.data.exams)
      ? event.data.exams.filter(exam => typeof exam?.name === 'string' && exam.name.trim())
      : [];
    loadError = event.data.error === true;
    updateExamDropdown();
  });

  new MutationObserver(updateExamDropdown).observe(document.body, { childList: true, subtree: true });
})();
</script><script src="/question-bank-suite-filters.js"></script></body>
