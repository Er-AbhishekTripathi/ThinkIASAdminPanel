<form class="question-dialog" [formGroup]="form" (ngSubmit)="save()">
  <header mat-dialog-title class="dialog-heading">
    <div class="heading-icon"><mat-icon>edit_note</mat-icon></div>
    <div>
      <h2>{{ data.question ? 'Edit Mains Question' : 'Add Mains Question' }}</h2>
      <p>Theory questions do not use answer options.</p>
    </div>
    <button mat-icon-button type="button" mat-dialog-close aria-label="Close dialog"><mat-icon>close</mat-icon></button>
  </header>

  <mat-dialog-content>
    <label class="field-label">Question (English) <span>*</span></label>
    <ckeditor [editor]="Editor" [config]="editorConfig" formControlName="english"></ckeditor>
    <p class="field-error" *ngIf="form.controls.english.touched && form.controls.english.invalid">English question text is required.</p>

    <label class="field-label hindi-label">Question (Hindi)</label>
    <ckeditor [editor]="Editor" [config]="editorConfig" formControlName="hindi"></ckeditor>

    <mat-form-field appearance="outline" class="tag-field">
      <mat-label>Tags</mat-label>
      <mat-select formControlName="tags" multiple>
        <mat-option *ngFor="let tag of data.tags" [value]="tag._id">{{ tag.tag }}</mat-option>
      </mat-select>
      <mat-hint>Select topic tags to make questions easier to find.</mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="saving">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="saving">
      <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!saving">{{ data.question ? 'save' : 'add' }}</mat-icon>
      {{ data.question ? 'Save Changes' : 'Add Question' }}
    </button>
  </mat-dialog-actions>
</form>
